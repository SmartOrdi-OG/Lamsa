definitions:
  app: &app
    name: Lamsa
    bundle_id: com.lamsaai.app

workflows:
  ios-release:
    name: Lamsa iOS — TestFlight / App Store
    max_build_duration: 60
    integrations:
      # Name of the Apple Developer Portal / App Store Connect API key
      # integration as added under Team settings > Integrations — must
      # match that name exactly.
      app_store_connect: Lamsa
    environment:
      # No `ios_signing` block here on purpose — that key triggers
      # Codemagic's OTHER signing path ("Code Signing Identities": a
      # certificate/profile pre-uploaded under Team settings), which runs
      # its own pre-build check and fails immediately if nothing was
      # uploaded there. This workflow signs via the App Store Connect API
      # integration instead (see `integrations` above + the
      # app-store-connect/keychain script steps below), which is a
      # separate, mutually exclusive path — combining both made Codemagic
      # fail on the unused identities check before the real scripts ran.
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.lamsaai.app"
      node: latest
      xcode: latest
      cocoapods: default
    working_directory: ios-app
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install
      - name: Set up local keychain for code signing
        script: |
          keychain initialize
      - name: Fetch (or create) the App Store distribution certificate and profile
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add the certificate to the keychain
        script: |
          keychain add-certificates
      - name: Apply the fetched profile to the Xcode project
        script: |
          xcode-project use-profiles
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios-app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # Fill in app_store_connect under Codemagic's Teams > Integrations,
      # or set these as encrypted environment variables there — never
      # commit an API key to this file.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
