definitions:
  app: &app
    name: Lamsa
    bundle_id: com.lamsaai.app

workflows:
  ios-release:
    name: Lamsa iOS — TestFlight / App Store
    max_build_duration: 60
    integrations:
      # Name of the Apple Developer Portal / App Store Connect API key
      # integration as added under Team settings > Integrations — must
      # match that name exactly.
      app_store_connect: Lamsa
    environment:
      # No `ios_signing` block here on purpose — that key triggers
      # Codemagic's OTHER signing path ("Code Signing Identities": a
      # certificate/profile pre-uploaded under Team settings), which runs
      # its own pre-build check and fails immediately if nothing was
      # uploaded there. This workflow signs via the App Store Connect API
      # integration instead (see `integrations` above + the
      # app-store-connect/keychain script steps below), which is a
      # separate, mutually exclusive path — combining both made Codemagic
      # fail on the unused identities check before the real scripts ran.
      #
      # `fetch-signing-files ... --create` has to generate a brand-new
      # distribution certificate, and that needs a private key supplied
      # up front (the cert is only the public half — without a key to
      # pair it with, Codemagic can't save it, which is exactly the
      # "Cannot save Signing Certificates without certificate private
      # key" build failure). The `ios_signing` group below holds a
      # `CERTIFICATE_PRIVATE_KEY` secret set in Codemagic's Environment
      # variables (never committed here) that supplies that key.
      groups:
        - ios_signing
      vars:
        # This Capacitor project uses Swift Package Manager, not
        # CocoaPods (see ios/App/CapApp-SPM) — there's no Podfile and no
        # .xcworkspace, just the plain .xcodeproj.
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.lamsaai.app"
      node: latest
      xcode: latest
    working_directory: ios-app
    scripts:
      - name: Install dependencies and sync Capacitor
        script: |
          # ios/App/App/{public,config.xml,capacitor.config.json} are
          # Capacitor-generated and gitignored (see ios/.gitignore) —
          # they're meant to be regenerated by `cap sync`, not committed,
          # so the build needs this step to create them fresh every time.
          npm ci
          npx cap sync ios
      - name: Set up local keychain for code signing
        script: |
          keychain initialize
      - name: Fetch (or create) the App Store distribution certificate and profile
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add the certificate to the keychain
        script: |
          keychain add-certificates
      - name: Apply the fetched profile to the Xcode project
        script: |
          xcode-project use-profiles
      - name: Set the build number one past the latest TestFlight build
        script: |
          # App Store Connect rejects re-uploading a build number that's
          # already been used (hit this exact failure once — "The bundle
          # version must be higher than the previously uploaded version").
          # Querying the latest build here means this never needs a manual
          # bump in project.pbxproj again.
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$BUNDLE_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      # `xcode-project build-ipa` writes to a fixed build-directory path
      # (not relative to `working_directory: ios-app`), so this must NOT
      # be prefixed with `ios-app/` — that prefix is why publishing
      # skipped with "No IPA or PKG files found" despite the export
      # itself succeeding (log: "exported to build/ios/ipa/App.ipa").
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # Fill in app_store_connect under Codemagic's Teams > Integrations,
      # or set these as encrypted environment variables there — never
      # commit an API key to this file.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
