<script>
  // Basic Telegram Mini App wiring: window.Telegram.WebApp only exists when
  // this page is opened inside Telegram's WebView, so this is a no-op in a
  // normal browser tab or the Android/iOS app shells.
  var isTelegramMiniApp = false;
  try {
    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      isTelegramMiniApp = true;
      tg.ready();
      tg.expand();
      // Otherwise Telegram treats a vertical swipe anywhere on the page as
      // its own gesture to minimize/close the Mini App, which is exactly
      // the "screen moves when I swipe up or down" behavior being fixed.
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
      if (tg.setHeaderColor) tg.setHeaderColor('#f6f7f8');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#f6f7f8');
    }
  } catch (e) {}
</script>
<style>
  .icon-svg { width: 1.15em; height: 1.15em; vertical-align: -0.18em; display: inline-block; flex-shrink: 0; }
  :root {
    color-scheme: light;
    --black: #f6f7f8;
    --dark: #edeff1;
    --card: #ffffff;
    --card-2: #fbfbfc;
    --border: #dfe2e6;
    --border-soft: rgba(107,116,128,0.24);
    --gold: #6b7480;
    --gold-light: #a3abb5;
    --gold-deep: #3d434b;
    --gold-dim: rgba(107,116,128,0.10);
    --white: #1b1e22;
    --gray: #767d86;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* Stops the page from bouncing/sliding when a swipe drags past the top
     or bottom of the scrollable area. */
  html, body { overscroll-behavior: none; }
  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--black);
    color: var(--white);
    min-height: 100vh;
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--dark); }
  ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }

  /* shared metallic shine sweep */
  .shine-surface { position: relative; overflow: hidden; }
  .shine-surface::after {
    content: '';
    position: absolute; top: -80%; left: -40%;
    width: 24%; height: 260%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.95), transparent);
    transform: rotate(22deg);
    animation: shine-sweep 2.6s ease-in-out infinite;
    animation-delay: 0.6s;
    pointer-events: none;
  }
  @keyframes shine-sweep {
    0%, 25%  { left: -40%; }
    70%, 100% { left: 130%; }
  }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--white); }
  .logo-icon {
    width: 36px; height: 36px;
    border: 1.5px solid var(--gold);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .logo-text { font-size: 19px; font-weight: 900; letter-spacing: 1px; }
  .back-link {
    color: var(--gray);
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--gold); }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .nav-logout {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--gray);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px; font-weight: 700;
    font-family: 'Tajawal', sans-serif;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .nav-logout:hover { border-color: var(--gold); color: var(--gold); }
  .lang-select {
    background: transparent; border: 1px solid var(--border); color: var(--gray);
    padding: 6px 8px; border-radius: 6px; font-size: 12.5px; font-weight: 700; font-family: 'Tajawal', sans-serif;
    cursor: pointer; max-width: 110px;
  }

  .wrap { max-width: 560px; margin: 0 auto; padding: 100px 20px 60px; }
  .hero { max-width: 560px; margin: 0 auto; }
  h1 { font-size: clamp(26px, 6vw, 36px); font-weight: 900; text-align: center; margin-bottom: 10px; }
  .sub { color: var(--gray); font-size: 14px; text-align: center; line-height: 1.6; margin-bottom: 36px; }

  .module-card {
    background: var(--dark);
    border: 2px solid var(--gold);
    border-radius: 18px;
    padding: 26px 20px;
    box-shadow: 0 20px 50px rgba(107,116,128,0.15);
  }

  .module-header { text-align: center; margin-bottom: 20px; }
  .module-icon { font-size: 32px; margin-bottom: 8px; }
  .module-title { font-size: 19px; font-weight: 900; margin-bottom: 8px; }
  .module-desc { color: var(--gray); font-size: 12.5px; line-height: 1.5; }

  .sub-toggle { display: flex; gap: 8px; margin-bottom: 18px; }
  .sub-toggle-btn {
    flex: 1;
    background: var(--card);
    border: 1.5px solid var(--border);
    color: var(--gray);
    padding: 10px 6px;
    border-radius: 10px;
    font-family: 'Tajawal', sans-serif;
    font-size: 12px; font-weight: 900;
    cursor: pointer;
    transition: all 0.2s;
  }
  .sub-toggle-btn:hover { border-color: var(--gold); }
  .sub-toggle-btn.active { border-color: var(--gold); background: var(--gold-dim); color: var(--white); }

  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 34px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .upload-zone:hover, .upload-zone.dragover { border-color: var(--gold); background: var(--gold-dim); }
  .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-icon { font-size: 34px; margin-bottom: 10px; }
  .upload-title { font-size: 13.5px; font-weight: 700; margin-bottom: 6px; }
  .upload-sub { font-size: 11px; color: var(--gray); }

  .upload-preview { display: none; position: relative; }
  .upload-preview img { width: 100%; max-height: 260px; object-fit: contain; border-radius: 14px; border: 1px solid var(--border); background: #f3f4f5; display: block; }
  .upload-preview .remove-btn {
    position: absolute; top: 10px; right: 10px;
    background: rgba(0,0,0,0.7);
    border: 1px solid var(--border);
    color: white; border-radius: 6px;
    padding: 6px 12px; font-size: 12px;
    cursor: pointer;
  }

  .generate-btn {
    width: 100%;
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, #eef0f2 0%, var(--gold-light) 16%, var(--gold) 42%, var(--gold-deep) 65%, var(--gold) 84%, #eef0f2 100%);
    color: var(--card);
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
    border: none;
    padding: 18px;
    border-radius: 12px;
    font-family: 'Tajawal', sans-serif;
    font-size: 15px; font-weight: 900;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 16px;
    box-shadow: 0 16px 34px -8px rgba(61,67,75,0.5), inset 0 1px 0 rgba(255,255,255,0.55);
  }
  .generate-btn::after {
    content: '';
    position: absolute; top: -80%; left: -40%;
    width: 20%; height: 260%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.95), transparent);
    transform: rotate(22deg);
    animation: shine-sweep 2.6s ease-in-out infinite;
    animation-delay: 0.6s;
    pointer-events: none;
  }
  .generate-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 20px 44px -6px rgba(107,116,128,0.55); }
  .generate-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .generate-btn:disabled::after { animation: none; display: none; }

  .result-area { display: none; max-width: 560px; margin: 32px auto 0; }
  .result-area.show { display: block; animation: fadeUp 0.5s ease both; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  .result-img-wrap {
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    aspect-ratio: 16/9;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .result-placeholder { text-align: center; color: var(--gray); padding: 20px; }
  .result-placeholder .rp-icon { font-size: 48px; margin-bottom: 12px; }
  .result-placeholder p { font-size: 14px; }
  .result-placeholder small { font-size: 11px; color: #444; }
  .loading-dots { display: none; justify-content: center; gap: 8px; margin-top: 16px; }
  .loading-dots.show { display: flex; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: bounce 1.4s infinite ease-in-out both; }
  .dot:nth-child(1) { animation-delay: -0.32s; }
  .dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }

  /* NEARBY STORES */
  .nearby-stores { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
  .nearby-stores-title { font-size: 15px; font-weight: 900; margin-bottom: 4px; }
  .nearby-stores-sub { font-size: 12px; color: var(--gray); margin-bottom: 14px; }
  .nearby-stores-list { display: flex; flex-direction: column; gap: 10px; }
  .nearby-store-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px;
  }
  .nearby-store-name { font-size: 13.5px; font-weight: 700; }
  .nearby-store-btn {
    flex-shrink: 0;
    background: transparent; border: 1.5px solid var(--gold); color: var(--gold);
    font-family: 'Tajawal', sans-serif; font-size: 11.5px; font-weight: 700;
    padding: 7px 12px; border-radius: 20px; text-decoration: none;
    white-space: nowrap; transition: all 0.2s;
  }
  .nearby-store-btn:hover { background: var(--gold-dim); }

  /* Cycling before/after background (Ken Burns zoom + wipe reveal) for the
     paywall's hero image — same mechanic as the main app's hero/demo
     gallery, ported here since this page has its own standalone paywall. */
  .hero-pair { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease; }
  .hero-pair.active { opacity: 1; }
  .hero-pair-zoom { position: absolute; inset: -3%; }
  .hero-pair.active .hero-pair-zoom { animation: heroKenburns 2s ease-in-out forwards; }
  @keyframes heroKenburns { 0% { transform: scale(1.02); } 100% { transform: scale(1.08); } }
  .hero-layer { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .hero-layer-after { clip-path: inset(0 100% 0 0); }
  .hero-pair.active .hero-layer-after { animation: heroWipeReveal 2s cubic-bezier(.65,0,.35,1) forwards; }
  @keyframes heroWipeReveal {
    0%   { clip-path: inset(0 100% 0 0); }
    38%  { clip-path: inset(0 100% 0 0); }
    66%  { clip-path: inset(0 0% 0 0); }
    100% { clip-path: inset(0 0% 0 0); }
  }
  .hero-edge {
    position: absolute; top: 0; bottom: 0; width: 3px;
    background: rgba(255,255,255,0.85);
    box-shadow: 0 0 18px 2px rgba(255,255,255,0.55);
    opacity: 0;
  }
  .hero-pair.active .hero-edge { animation: heroEdgeSweep 2s cubic-bezier(.65,0,.35,1) forwards; }
  @keyframes heroEdgeSweep {
    0%   { left: 0%; opacity: 0; }
    36%  { left: 0%; opacity: 0; }
    38%  { opacity: 1; }
    66%  { left: 100%; opacity: 1; }
    68%  { opacity: 0; }
    100% { left: 100%; opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-pair.active .hero-pair-zoom, .hero-pair.active .hero-layer-after, .hero-pair.active .hero-edge { animation: none; }
    .hero-pair.active .hero-layer-after { clip-path: inset(0 0% 0 0); }
  }
</style>
</head>

<script>
  var REARRANGE_PROMPT =
    'CRITICAL: Do NOT add any new furniture. Do NOT change any existing furniture.\n' +
    'Use ONLY what is visible in the original photo.\n' +
    'The same sofa, same bed, same chairs, same items — just moved to new positions.\n\n' +
    'You are an expert interior designer tasked with DRAMATICALLY rearranging this room.\n\n' +
    'MANDATORY CHANGES - every single piece must move:\n' +
    '- The sofa/largest seating: move to completely opposite wall or perpendicular position\n' +
    '- The bed: move headboard to a different wall entirely\n' +
    '- Coffee table: reposition to center of new seating arrangement\n' +
    '- All chairs: rotate and reposition to face new focal point\n' +
    '- Wardrobe/tall pieces: slide to different wall\n' +
    '- TV unit: only move if space allows\n\n' +
    'DESIGN PRINCIPLES to apply:\n' +
    '- Identify the room focal point (TV, window, fireplace)\n' +
    '- All seating must face the focal point\n' +
    '- Create 60-90cm clear walkways\n' +
    '- No furniture blocking doors or windows\n' +
    '- Balance visual weight left and right\n' +
    '- Create intimate conversation groupings\n\n' +
    'The before and after must look COMPLETELY DIFFERENT in furniture layout.\n' +
    'Furniture appearance stays 100% identical - same color, material, size.\n' +
    'Output: photorealistic, professional interior design result.';

  var FULL_REDESIGN_PROMPT =
    'CRITICAL: This must be a DRAMATIC, COMPLETE visual transformation of the room — not a minor touch-up. ' +
    'If someone compares the before and after side by side, almost nothing about the decor should look the same.\n\n' +
    'You are an expert interior designer tasked with a full redesign of this room.\n\n' +
    'MANDATORY CHANGES - every one of these must be clearly, visibly different from the original photo:\n' +
    '- Wall color/finish: change to a new palette, different from the original\n' +
    '- Flooring: change the material, color, or finish\n' +
    '- Every furniture piece (sofas, chairs, tables, storage, bed): REPLACE with different pieces — different shape, material, and color than what is in the photo\n' +
    '- Lighting fixtures: replace with new fixtures\n' +
    '- Decor and accessories (art, rugs, plants, curtains, cushions): replace entirely with new items\n' +
    '- Furniture layout: rearrange into a new configuration, not the same positions as the original\n\n' +
    'DESIGN PRINCIPLES to apply:\n' +
    '- Identify the room focal point (TV, window, fireplace) and design around it\n' +
    '- All seating must face the focal point\n' +

  window.addEventListener('DOMContentLoaded', function() {

  function setupDropZone() {
    var zone = document.getElementById('uploadZone');
    zone.addEventListener('dragover', function(e) { e.preventDefault(); e.stopPropagation(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', function(e) { e.preventDefault(); e.stopPropagation(); zone.classList.remove('dragover'); });
    zone.addEventListener('drop', function(e) {
      e.preventDefault(); e.stopPropagation();
      zone.classList.remove('dragover');
      var file = e.dataTransfer.files[0];
      if (!file || !file.type.startsWith('image/')) return;
      setUploadedFile(file);
    });
  }

  function compressImage(file, maxSize, quality, callback) {
    var img = new Image();
    var objUrl = URL.createObjectURL(file);
    img.onload = function() {
      URL.revokeObjectURL(objUrl);
      var w = img.width, h = img.height;
      if (w > maxSize || h > maxSize) {
        if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
        else { w = Math.round(w * maxSize / h); h = maxSize; }
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = function() {
      URL.revokeObjectURL(objUrl);
      var fr = new FileReader();
      fr.onload = function(e) { callback(e.target.result); };
      fr.readAsDataURL(file);
    };
    img.src = objUrl;
  }

    document.getElementById('generateBtn').disabled = !state.uploadedFile;
  }

  function createDownloadBtn(url, filename) {
    var wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;gap:10px;margin:10px 0;';

    var saveBtn = document.createElement('button');
    saveBtn.style.cssText = 'flex:1;background:var(--gold);color:var(--black);border:none;' +
      'padding:14px;border-radius:10px;font-weight:900;font-size:14px;cursor:pointer;' +
      'font-family:Tajawal,sans-serif;transition:all 0.2s;';
    saveBtn.innerHTML = (window.icon ? window.icon('download') : '') + ' ' + tr('Save Image');
    saveBtn.onclick = function() {
      // `download` on an <a> is silently ignored for cross-origin URLs (the
      // image lives on fal.ai's domain, not ours), so this used to just
      // open the image instead of saving it. Routed through /api/download-
      // image (fetches server-side, sidestepping CORS) then handed off as
      // a real file: native share sheet on iOS/Android, real download via
      // a same-origin blob URL everywhere else.
      fetch('/api/download-image?url=' + encodeURIComponent(url) + '&filename=' + encodeURIComponent(filename))
        .then(function(resp) { return resp.blob(); })
        .then(function(blob) {
          var file = new File([blob], filename, { type: blob.type || 'image/jpeg' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            return navigator.share({ files: [file] });
          }
          var blobUrl = URL.createObjectURL(blob);
          var link = document.createElement('a');
          link.href = blobUrl;
          link.download = filename;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(blobUrl);
        })
        .catch(function(err) {
          console.error('[save] failed, falling back to opening the image directly:', err);
          window.open(url, '_blank');
        });
    };

    var shareBtn = document.createElement('button');
    shareBtn.style.cssText = 'background:transparent;color:var(--gold);border:1.5px solid var(--gold);' +
      'padding:14px 18px;border-radius:10px;font-weight:900;font-size:14px;cursor:pointer;' +
      'font-family:Tajawal,sans-serif;transition:all 0.2s;white-space:nowrap;';
    shareBtn.innerHTML = (window.icon ? window.icon('share') : '') + ' ' + tr('Share');
    shareBtn.onclick = function() {
      // Sharing { url } hands apps like WhatsApp a link, which they render
      // as a page-preview card, not the photo itself. Fetching the actual
      // bytes (via the same CORS-safe proxy as Save) and sharing them as a
      // file makes WhatsApp/etc. attach the real image instead.
      fetch('/api/download-image?url=' + encodeURIComponent(url) + '&filename=' + encodeURIComponent(filename))
        .then(function(resp) { return resp.blob(); })
        .then(function(blob) {
          var file = new File([blob], filename, { type: blob.type || 'image/jpeg' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            return navigator.share({ files: [file], title: 'Lamsa Rearranged Room' });
          }
          if (navigator.share) {
            return navigator.share({ title: 'Lamsa Rearranged Room', url: url });
          }
          window.open(url, '_blank');
        })
        .catch(function(err) {
          console.error('[share] failed, falling back to sharing the link:', err);
          if (navigator.share) {
            navigator.share({ title: 'Lamsa Rearranged Room', url: url }).catch(function() { window.open(url, '_blank'); });
          } else {
            window.open(url, '_blank');
          }
        });
    };

    wrap.appendChild(saveBtn);
    wrap.appendChild(shareBtn);
    return wrap;
  }

  var POLL_INTERVAL_MS = 3000; // poll every 3 seconds
  var POLL_TIMEOUT_MS = 2 * 60 * 1000; // 2 minutes

  // fal.ai's queue result payload shape varies by endpoint/version — sometimes the
  // images are top-level, sometimes nested under output/response/data. Check every
  // known shape instead of assuming just `data.images`.
  function extractResultImages(data) {
    if (!data) return null;
    if (Array.isArray(data.images) && data.images.length) return data.images;
    if (data.image && data.image.url) return [data.image];
    if (data.output && Array.isArray(data.output.images) && data.output.images.length) return data.output.images;
    if (data.response && Array.isArray(data.response.images) && data.response.images.length) return data.response.images;
    if (data.data && Array.isArray(data.data.images) && data.data.images.length) return data.data.images;
    return null;
  }

  function fetchJson(url) {
    return fetch(url).then(function(res) {
      return res.json().then(function(data) {
        return { ok: res.ok, status: res.status, data: data };
      });
    });
  }

  // Resolves to { url } of the completed generation, or null if polling
  // failed/timed out (an error has already been shown to the user in that
  // case, so callers just need to bail out).
  function pollForResult(requestId, model, startTime) {
    return new Promise(function(resolve) {
      function tick() {
        var elapsed = Date.now() - startTime;
        if (elapsed >= POLL_TIMEOUT_MS) {
          console.error('[generate] polling timed out after ' + Math.round(elapsed / 1000) + 's for request_id:', requestId);
          showError(tr('Generation took too long. Please try again.'));
          resolve(null);
          return;
        }

        console.log('[generate] polling status for', model, requestId, '(elapsed ' + Math.round(elapsed / 1000) + 's)');

        fetchJson('/api/status?request_id=' + encodeURIComponent(requestId) + '&model=' + encodeURIComponent(model))
          .then(function(result) {
            console.log('[generate] status response (http ' + result.status + '):', result.data);

            if (!result.ok) {
              console.error('[generate] status check returned an error:', result.data);
              showError(tr('Error generating image. Please try again.'));
              resolve(null);
              return;
            }

            // fal.ai returns status in varying casing depending on the endpoint version,
            // so normalize before comparing.
            var status = (result.data.status || '').toString().toUpperCase();

            if (status === 'COMPLETED') {
              console.log('[generate] status COMPLETED — fetching final result for', model, requestId);
              fetchJson('/api/status?request_id=' + encodeURIComponent(requestId) + '&model=' + encodeURIComponent(model) + '&mode=result&tool=rearrange')
                .then(function(resultResp) {
                  console.log('[generate] result response (http ' + resultResp.status + '):', resultResp.data);
                  if (!resultResp.ok) {
                    console.error('[generate] result fetch returned an error:', resultResp.data);
                    showError(tr('Error generating image. Please try again.'));
                    resolve(null);
                    return;
                  }
                  var images = extractResultImages(resultResp.data);
                  resolve(images && images.length ? images[0] : null);
                })
                .catch(function(err) {
                  console.error('[generate] result fetch threw:', err);
                  showError(tr('Connection error. Please try again.'));
                  resolve(null);
                });
            } else if (status === 'FAILED' || status === 'ERROR') {
              console.error('[generate] generation failed:', result.data);
              showError(tr('Error generating image. Please try again.'));
              resolve(null);
            } else {
              console.log('[generate] status = ' + status + ' — polling again in ' + (POLL_INTERVAL_MS / 1000) + 's');
              setTimeout(tick, POLL_INTERVAL_MS);
            }
          })
          .catch(function(err) {
            console.error('[generate] status check threw:', err);
            showError(tr('Connection error. Please try again.'));
            resolve(null);
          });
      }
      tick();
    });
  }

  // Stage 2: asks Nano Banana Pro to polish Flux's own output image (rather
  // than starting over from the original photo) — mirrors the same
  // refine_token flow used on the main designer page. Falls back to Flux's
  // own (unpolished) result if the refine call or its polling fails,
  // instead of failing the whole generation.
  function refineWithNano(fluxImage, refineToken, refinementPrompt) {
    if (!refineToken) return Promise.resolve(fluxImage);

    return fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ prompt: refinementPrompt, image_url: fluxImage.url, refine_token: refineToken })
    })
    .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
    .then(function(result) {
      if (!result.ok || !result.data || !Array.isArray(result.data.requests) || !result.data.requests.length) {
        console.error('[generate] refine submit failed, falling back to Flux result:', result.data);
        return fluxImage;
      }
      var req = result.data.requests[0];
      return pollForResult(req.request_id, req.model, Date.now()).then(function(image) {
        return image || fluxImage;
      });
    })
    .catch(function(err) {
      console.error('[generate] refine request error, falling back to Flux result:', err);
      return fluxImage;
    });
  }

  function callGenerate(imageUrl, prompt, guidanceScale, strength, refinementPrompt) {
    var requestBody = {
      prompt: prompt,
      image_url: imageUrl,
      num_images: 1,
      guidance_scale: guidanceScale || 3.5,
      aspect_ratio: '16:9'
    };
    // fal.ai's `strength` (0-1) caps how much the output may differ from the
    // source photo — separate from guidance_scale (prompt weight) — and
    // defaults to 0.1 (a light touch-up) when omitted.
    if (imageUrl && typeof strength === 'number') requestBody.strength = strength;
    console.log('[generate] POST /api/generate:', requestBody);

    fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(requestBody)
    })
    .then(function(res) {
      return res.json().then(function(data) { return { ok: res.ok, status: res.status, data: data }; });
    })
    .then(function(result) {
      console.log('[generate] /api/generate response (http ' + result.status + '):', result.data);

      if (result.status === 401) {
        console.log('[generate] session expired, redirecting to login');
        window.location.replace('lamsa-auth.html');
        return;
      }

      if (result.status === 402) {
        console.log('[generate] blocked - no credits remaining');
        document.getElementById('loadingDots').classList.remove('show');
        document.getElementById('resultArea').classList.remove('show');
        showCreditsModal(tr("You're out of credits — buy more to continue"));
        refreshCreditBalance();
        return;
      }

      if (!result.ok || !result.data || !Array.isArray(result.data.requests) || !result.data.requests.length) {
        console.error('[generate] no requests[] in response:', result.data);
        showError(tr('Error generating image. Please try again.'));
        return;
      }

      var fluxReq = result.data.requests[0];
      var refineToken = result.data.refineToken;
      console.log('[generate] flux request_id received:', fluxReq.request_id, '— starting poll loop');
      pollForResult(fluxReq.request_id, fluxReq.model, Date.now()).then(function(fluxImage) {
        if (!fluxImage) return; // pollForResult already showed an error
        refineWithNano(fluxImage, refineToken, refinementPrompt).then(function(finalImage) {
          renderGenerateResult({ images: [finalImage] });
        });
      });
    })
    .catch(function(err) {
      console.error('[generate] /api/generate call threw:', err);
      showError(tr('Connection error. Please try again.'));
    });
  }

  // Compresses + uploads the photo once, then caches and reuses the hosted URL
  // for the generate call so we never re-upload the same photo twice.
  function ensurePhotoUploaded(callback) {
    if (state.uploadedImageUrl) {
      console.log('[upload] reusing already-uploaded photo url:', state.uploadedImageUrl);
      callback(state.uploadedImageUrl);
      return;
    }

    console.log('[upload] compressing image:', state.uploadedFile.name, state.uploadedFile.size + ' bytes');
    compressImage(state.uploadedFile, 1536, 0.9, function(imageDataUrl) {
      console.log('[upload] image compressed, uploading to /api/upload');
      fetch('/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image_data: imageDataUrl, mime_type: state.uploadedFile.type || 'image/jpeg' })
      })
      .then(function(res) {
        return res.json().then(function(data) { return { ok: res.ok, status: res.status, data: data }; });
      })
      .then(function(result) {
        console.log('[upload] /api/upload response (http ' + result.status + '):', result.data);
        if (!result.ok || !result.data || !result.data.url) {
          console.error('[upload] upload did not return a usable url, falling back to inline data url');
        }
        state.uploadedImageUrl = (result.ok && result.data && result.data.url) ? result.data.url : imageDataUrl;
        callback(state.uploadedImageUrl);
      })
      .catch(function(err) {
        console.error('[upload] upload call threw:', err);
        showError(tr('Image upload failed. Please try again.'));
      });
    });
  }

  // ===== AUTH (real server session) + CREDITS / SUBSCRIPTIONS =====
  var currentUser = null;

  // The server session cookie is what actually gates generate()/credits/
  // checkout — this call enforces that, redirecting to login if the session
  // is missing or expired. The localStorage flag checked at the top of
  // <head> is just a fast optimistic check, not a security boundary.
  // Resolves to the logged-in user, or null for a guest — never redirects.
  function checkAuth() {
    return fetch('/api/me', { credentials: 'include' })
      .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); })
      .then(function(result) {
        if (!result.ok) {
          try { localStorage.removeItem('lamsa_user'); } catch (e) {}
          return null;
        }
        currentUser = result.data;
        try { localStorage.setItem('lamsa_user', JSON.stringify({ username: currentUser.username, email: currentUser.email, loggedIn: true })); } catch (e) {}
        return currentUser;
      })
      .catch(function(err) {
        console.error('[auth] session check failed:', err);
        return null;
      });
  }

  // Guest-safe gate for Generate — sends the visitor to sign in and
  // returns false if there's no account yet.
  function requireLogin() {
    if (currentUser) return true;
    window.location.href = 'lamsa-auth.html';
    return false;
  }

  function logout() {
    fetch('/api/auth-logout', { method: 'POST', credentials: 'include' })
      .catch(function(err) { console.error('[auth] logout request failed:', err); })
      .then(function() {
        try { localStorage.removeItem('lamsa_user'); } catch (e) {}
        window.location.replace('lamsa-auth.html');
      });
  }

  var BG_CYCLE_PAIRS = [

    { before: 'assets/hero-bg/pair7-before.jpg', after: 'assets/hero-bg/pair7-after.jpg' }
  ];

  function buildBgCycle(containerId) {
    var stackEl = document.getElementById(containerId);
    if (!stackEl) return;

    var pairs = [];
    BG_CYCLE_PAIRS.forEach(function (p) {
      var pair = document.createElement('div');
      pair.className = 'hero-pair';
      var zoom = document.createElement('div');
      zoom.className = 'hero-pair-zoom';
      var before = document.createElement('div');
      before.className = 'hero-layer hero-layer-before';
      before.style.backgroundImage = 'url(' + p.before + ')';
      var after = document.createElement('div');
      after.className = 'hero-layer hero-layer-after';
      after.style.backgroundImage = 'url(' + p.after + ')';
      var edge = document.createElement('div');
      edge.className = 'hero-edge';
      zoom.appendChild(before);
      zoom.appendChild(after);
      zoom.appendChild(edge);
      pair.appendChild(zoom);
      stackEl.appendChild(pair);
      pairs.push(pair);
    });

    var current = -1;
    var HOLD_MS = 2000;
    function restartAnim(el) { if (el) { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; } }
    function show(i) {
      pairs.forEach(function (p, idx) {
        p.classList.toggle('active', idx === i);
        if (idx === i) {
          restartAnim(p.querySelector('.hero-pair-zoom'));
          restartAnim(p.querySelector('.hero-layer-after'));
          restartAnim(p.querySelector('.hero-edge'));
        }
      });
      current = i;
    }
    function next() { show((current + 1) % pairs.length); }
    show(0);
    return setInterval(next, HOLD_MS);
  }

  function startCheckout(planId, buttonEl) {
    var errorEl = document.getElementById('creditsModalError');

    var buttons = buttonEl ? [buttonEl] : document.querySelectorAll('.cm-tier-card');
    Array.prototype.forEach.call(buttons, function(b) { b.disabled = true; b.style.opacity = '0.5'; });

    fetch('/api/create-checkout-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ plan: planId, return_page: 'rearrange.html' })
    })
    .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, status: r.status, data: data }; }); })
    .then(function(result) {
      if (result.status === 401) { window.location.replace('lamsa-auth.html'); return; }
      if (!result.ok || !result.data || !result.data.url) {
        if (errorEl) errorEl.textContent = (result.data && result.data.error) || tr('Something went wrong, please try again');
        Array.prototype.forEach.call(buttons, function(b) { b.disabled = false; b.style.opacity = '1'; });
        return;
      }
      if (!window.openOutsideAndroidTWA(result.data.url)) window.location.href = result.data.url;
    })
    .catch(function(err) {
      console.error('[checkout] failed:', err);
      if (errorEl) errorEl.textContent = tr('Connection error');
      Array.prototype.forEach.call(buttons, function(b) { b.disabled = false; b.style.opacity = '1'; });
    });
  }

  // Small dismissible banner for the checkout-success message below —
  // replaces a plain alert() with something that matches the app's own
  // look instead of a native browser dialog.
  function showStatusBanner(message) {
    var existing = document.getElementById('statusBanner');
    if (existing) existing.remove();

    var el = document.createElement('div');
    el.id = 'statusBanner';
    el.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-16px);z-index:10001;'
      + 'background:var(--card);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:12px;'
      + 'padding:14px 18px;box-shadow:0 24px 60px -20px rgba(20,20,20,0.35);display:flex;align-items:center;gap:10px;'
      + 'font-family:Tajawal,sans-serif;font-size:14px;color:var(--white);max-width:calc(100vw - 32px);'
      + 'opacity:0;transition:opacity 0.25s ease, transform 0.25s ease;';
    el.innerHTML = '<span style="font-size:18px;line-height:1;">' + (window.icon ? window.icon('check') : '✓') + '</span><span>' + message + '</span>';
    document.body.appendChild(el);

    requestAnimationFrame(function() {
      el.style.opacity = '1';
      el.style.transform = 'translateX(-50%) translateY(0)';
    });
    setTimeout(function() {
      el.style.opacity = '0';
      el.style.transform = 'translateX(-50%) translateY(-16px)';
      setTimeout(function() { el.remove(); }, 300);
    }, 4500);
  }

  function handleCheckoutRedirect() {
    var params = new URLSearchParams(window.location.search);
    var checkout = params.get('checkout');
    if (!checkout) return;

    if (checkout === 'success') {
      showStatusBanner(tr('Payment successful! Your balance will update in a few seconds.'));
      [500, 2000, 4000].forEach(function(delay) { setTimeout(refreshCreditBalance, delay); });
    }

    params.delete('checkout');
    var newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
    window.history.replaceState({}, '', newUrl);
  }

  function setLang(lang) {
    var cfg = Lang8.apply(lang, T);
    currentLang = cfg.code;
  }

  window.addEventListener('DOMContentLoaded', function() {
    Lang8.buildSelect(document.getElementById('langSelect'), setLang);
    var savedLang = 'en';
    try { savedLang = localStorage.getItem('lamsa_lang') || 'en'; } catch (e) {}
    setLang(savedLang);
    checkAuth().then(function(user) {
      document.getElementById('navSignInBtn').style.display = user ? 'none' : '';
      document.getElementById('navLogoutBtn').style.display = user ? '' : 'none';
      if (!user) return; // guest — nothing more to do until they sign in
      refreshCreditBalance();
      handleCheckoutRedirect();
    });
  });

  function generate() {
    if (!state.uploadedFile) return;
    if (!requireLogin()) return;

    console.log('[auto] Generate clicked, sub-mode =', state.subMode);

    document.getElementById('generateBtn').disabled = true;
    showResultLoading();

    var isRedesign = state.subMode === 'redesign';
    var promptToUse = isRedesign ? FULL_REDESIGN_PROMPT : REARRANGE_PROMPT;
    // Full Redesign needs the model to diverge much more from the source photo
    // than a plain rearrange, so give the prompt more weight (guidance_scale)
    // and allow it to actually move further from the source pixels
    // (strength) — fal.ai defaults strength to 0.1 when omitted, which is
    // far too conservative for a full redesign. 1 (max) let the model
    // regenerate the room's actual structure instead of just its contents,
    // so it's capped at 0.85 — same fix as the main designer page.
    // Plain rearrange was at 3.5/0.6 — too low for the model to actually
    // move furniture; it mostly just tweaked lighting/wall tone instead,
    // since that low a strength barely lets it diverge from the source
    // pixels. Raised, but kept below redesign's, so it still has enough
    // "hold the source image" pull to keep the same furniture pieces
    // instead of replacing them.
    var guidanceScale = isRedesign ? 7.5 : 5.5;
    var strength = isRedesign ? 0.85 : 0.75;

    // Stage 2 (Nano refine) polishes Flux's own output image, not the
    // original photo — reusing promptToUse here would resend redesign/
    // rearrange instructions against an already-finished image, causing
    // Nano to redo the transformation instead of just refining it.
    var refinementPrompt = isRedesign
      ? 'This photo already shows a fully redesigned room. Your ONLY task is to refine its visual quality: improve photorealism, lighting accuracy, and material/texture rendering. The walls, windows, and doors shown in this image are FIXED and must remain 100% identical in your output. Do NOT change the room shape, camera angle, or any furniture piece or position already shown in this image. This is a quality-enhancement pass only, not a redesign.'
      : 'This photo already shows a rearranged room. Your ONLY task is to refine its visual quality: improve photorealism, lighting accuracy, and material rendering. Do NOT move, add, remove, or restyle any furniture — keep every piece in the exact position and appearance already shown in this image. Do NOT change the room shape, walls, windows, doors, or camera angle. This is a quality-enhancement pass only.';

    ensurePhotoUploaded(function(url) {
      callGenerate(url, promptToUse, guidanceScale, strength, refinementPrompt);
    });
  }
</script>
</body>
</html>
