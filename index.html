<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Lamsa</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#221f1a">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<script src="js/platform.js"></script>
<noscript><meta http-equiv="refresh" content="0; url=lamsa-auth.html"></noscript>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #221f1a;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .splash {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .splash-brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .splash-icon {
    width: 52px; height: 52px;
    border: 1.5px solid rgba(255,255,255,0.55);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.14);
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  }
  .splash-icon img { max-width: 75%; max-height: 75%; object-fit: contain; }
  .splash-name {
    font-family: 'Playfair Display', serif;
    font-size: 30px; font-weight: 700;
    letter-spacing: 3px;
    color: #fff;
    text-shadow: 0 2px 14px rgba(0,0,0,0.35);
  }
  .splash-spinner {
    width: 30px; height: 30px;
    border: 3px solid rgba(255,255,255,0.18);
    border-top-color: #a3abb5;
    border-radius: 50%;
    animation: splash-spin 0.8s linear infinite;
  }
  @keyframes splash-spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
<div class="splash">
  <div class="splash-brand">
    <div class="splash-icon"><img src="assets/logo-mark.png" alt=""></div>
    <div class="splash-name">LAMSA</div>
  </div>
  <div class="splash-spinner"></div>
</div>
<script>
  setTimeout(function () { window.location.replace('lamsa-auth.html'); }, 1400);
</script>
</body>
</html>
